<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap"
      rel="stylesheet"
    />
    <title>Maria Kjellholm – Portfolio</title>
  </head>
  <body>
    <div id="root"></div>

    <form
      name="contact"
      netlify
      data-netlify="true"
      data-netlify-honeypot="company"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="subject" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="company" aria-hidden="true" tabindex="-1" />
      <!-- honeypot -->
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
